<a href="{{href}}" class="sol-card {{layout}}" id="{{id}}" data-source="{{imageSource}}">
  <span class="sol-card_img img-w" data-clip-reveal data-parallax-img><img src="{{image}}" alt="{{alt}}" class="img" loading="lazy" /></span>
  <span class="sol-card_b" data-reveal-fade>
    <span class="l1 text-muted sol-card_n">{{n}}</span>
    <span class="h2 sol-card_name">{{name}}</span>
    <span class="p1 sol-card_desc">{{description}}</span>
    <span class="link-line sol-card_link" data-hover-roll><span class="nav-item_label"><span class="l1">{{linkLabel}}</span><span class="l1">{{linkLabel}}</span></span></span>
  </span>
</a>
