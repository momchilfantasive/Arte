<article class="svc-option {{layout}}" id="{{id}}">
  <div class="svc-option_img img-w" data-clip-reveal data-parallax-img><img src="{{image}}" alt="{{alt}}" class="img" loading="lazy" /></div>
  <div class="svc-option_b" data-reveal-fade>
    <span class="l1 text-muted">{{n}}</span>
    <h3 class="h2">{{name}}</h3>
    <p class="p1">{{description}}</p>
    <p class="l1 svc-option_good"><span class="text-muted">Good for</span> {{goodFor}}</p>
  </div>
</article>
