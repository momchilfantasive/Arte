<!-- Cursor follower with contextual labels: add data-tip="Label" to any element -->
<div class="floating-tip" data-floating-tip aria-hidden="true">
  <div class="floating-tip_circle"><span class="l1" data-floating-tip-label>View</span></div>
</div>

<!-- CTA modal -->
<div class="modal" data-modal="cta" aria-hidden="true">
  <div class="modal_over" data-modal-close></div>
  <div class="modal_panel theme_on-dark" data-modal-panel data-lenis-prevent>
    <div class="modal_head">
      <div class="l1">Get in touch</div>
      <button class="nav-item" data-modal-close data-hover-roll><span class="nav-item_label"><span class="l1">Close</span><span class="l1">Close</span></span></button>
    </div>
    <div class="h2 modal_title" data-modal-p>Let's create something that endures</div>
    <form class="form" data-form>
      <label class="field" data-modal-p><span class="l1">Name</span><input name="name" required autocomplete="name" /></label>
      <label class="field" data-modal-p><span class="l1">Email</span><input name="email" type="email" required autocomplete="email" /></label>
      <label class="field" data-modal-p><span class="l1">Phone</span><input name="phone" type="tel" autocomplete="tel" /></label>
      <fieldset class="field field-chips" data-modal-p>
        <legend class="l1">Interest</legend>
        <label class="chip"><input type="radio" name="interest" value="buy" checked /><span class="l1">Residence</span></label>
        <label class="chip"><input type="radio" name="interest" value="invest" /><span class="l1">Investment</span></label>
        <label class="chip"><input type="radio" name="interest" value="partner" /><span class="l1">Partnership</span></label>
      </fieldset>
      <label class="field" data-modal-p><span class="l1">Message</span><textarea name="message" rows="3"></textarea></label>
      <button type="submit" class="link-line" data-modal-p data-hover-roll>
        <span class="nav-item_label"><span class="l1">Send request</span><span class="l1">Send request</span></span>
        <span class="link-line_ico">→</span>
      </button>
      <div class="form_success h2" data-form-success>Thank you. We'll be in touch shortly.</div>
    </form>
  </div>
</div>

    </div>

      <a href="/contact.html" class="h1 modal_link" data-modal-close data-modal-p>Contact</a>
    </nav>
    <div class="modal_menu_b container l1" data-modal-p>© <span data-year>0000</span>. Arte group. All rights reserved</div>
  </div>
</div>
