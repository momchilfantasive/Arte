<!-- Cursor follower with contextual labels: add data-tip="Label" to any element -->
<div class="floating-tip" data-floating-tip aria-hidden="true">
  <div class="floating-tip_circle"><span class="l1" data-floating-tip-label>View</span></div>
</div>

<!-- Gallery lightbox: opened by [data-gallery-open="index"], items from [data-gallery-list] in the page -->
<div class="lightbox theme_on-dark" data-lightbox role="dialog" aria-modal="true" aria-label="Gallery" aria-hidden="true">
  <div class="lightbox_head container">
    <div class="l1" data-lightbox-title>Gallery</div>
    <div class="l1 lightbox_count" data-lightbox-count>01 / 03</div>
    <button class="nav-item lightbox_close" data-lightbox-close data-hover-roll><span class="nav-item_label"><span class="l1">Close ×</span><span class="l1">Close ×</span></span></button>
  </div>
  <figure class="lightbox_stage">
    <img alt="" data-lightbox-img />
    <figcaption class="h3" data-lightbox-caption></figcaption>
  </figure>
  <div class="lightbox_nav container">
    <button class="nav-item" data-lightbox-prev data-hover-roll><span class="nav-item_label"><span class="l1">Prev</span><span class="l1">Prev</span></span></button>
    <button class="nav-item" data-lightbox-next data-hover-roll><span class="nav-item_label"><span class="l1">Next</span><span class="l1">Next</span></span></button>
  </div>
</div>

<!-- Site theme switcher (dark / light) -->
<div class="site-switch" role="group" aria-label="Site theme" data-site-switch>
  <button type="button" data-site-set="dark" aria-pressed="true">Dark</button>
  <button type="button" data-site-set="light" aria-pressed="false">Light</button>
</div>

<!-- Mobile menu modal -->
<div class="modal modal-menu" data-modal="menu" aria-hidden="true">
  <div class="modal_menu theme_on-dark" data-modal-panel>
    <div class="modal_head container">
      <button class="nav-item" data-modal-close data-hover-roll><span class="nav-item_label"><span class="l1">Close</span><span class="l1">Close</span></span></button>
    </div>
    <nav class="modal_menu_list container" aria-label="Mobile">
      <a href="index.html" class="h1 modal_link" data-modal-close data-modal-p>Home</a>
      <a href="curtains.html" class="h1 modal_link" data-modal-close data-modal-p>Solutions</a>
      <a href="projects.html" class="h1 modal_link" data-modal-close data-modal-p>Projects</a>
      <a href="showrooms.html" class="h1 modal_link" data-modal-close data-modal-p>Showrooms</a>
      <a href="professionals.html" class="h1 modal_link" data-modal-close data-modal-p>For professionals</a>
      <a href="contact.html" class="h1 modal_link" data-modal-close data-modal-p>Book a consultation</a>
    </nav>
    <div class="modal_menu_b container l1" data-modal-p>Arte del Lusso · Design exploration, October 2026</div>
  </div>
</div>
